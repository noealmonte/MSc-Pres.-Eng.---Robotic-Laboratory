[project]
name = "robotics-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noé Almonte", email = "noe.almonte@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.85.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "protobuf>=7.36.2",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[project.scripts]
robotics-lab = "robotics_lab:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
